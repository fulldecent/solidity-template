name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    # Runs on all pull requests targeting any branch
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: Prettier & Markdownlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run lint:prettier

      - name: Check Markdown (markdownlint)
        run: npm run lint:markdown

      - name: Set up Rust
        run: rustup show

      - name: Install lintspec
        run: |
          bin=$(dirname "$(rustup which cargo)")
          PATH="$bin:$PATH" "$bin/cargo" install lintspec --version 0.20.0 --locked

      - name: Check NatSpec (lintspec)
        run: npm run lint:natspec
